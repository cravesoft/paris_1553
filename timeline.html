    // ── Lookups ───────────────────────────────────
    const eventById = {};
    HISTORY.forEach(e => { eventById[e.id] = e; });
    let filteredEvents = HISTORY.slice();

    // ── Helpers ───────────────────────────────────
    function darken(hex, amt) {
        hex = hex.replace('#', '');
        const r = Math.max(0, parseInt(hex.slice(0,2),16) - amt);
        const g = Math.max(0, parseInt(hex.slice(2,4),16) - amt);
        const b = Math.max(0, parseInt(hex.slice(4,6),16) - amt);
        return '#'+[r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
    }
    function truncate(text, max) {
        if (!text || text.length <= max) return { html: text, truncated: false };
        const cut = text.substring(0, max).replace(/\s+\S*$/, '');
        return {
            html: `<span class="desc-short">${cut}<span style="color:var(--ink-lt)">&hellip;</span></span><span class="desc-full">${text}</span>`,
            truncated: true
        };
    }

    // ── Render ────────────────────────────────────
    function renderTimeline() {
        const container = document.getElementById('timeline-content');
        container.innerHTML = '';
        let lastPeriod = null, lastSortKey = null;

        filteredEvents.forEach((evt, idx) => {
            const cat = CATEGORIES[evt.category];
            const period = PERIODS[evt.period];

            if (evt.period !== lastPeriod) {
                const hdr = document.createElement('div');
                hdr.className = 'period-header';
                hdr.innerHTML = `<h2>${period.label}</h2>
                    <span class="period-sub">${period.sub}</span>
                    <span class="period-range">${period.range}</span>
                    <div class="period-rule"></div>`;
                container.appendChild(hdr);
                lastPeriod = evt.period;
                lastSortKey = null;
            }

            if (lastSortKey !== null) {
                const gap = evt.sortKey - lastSortKey;
                if (gap > 60) {
                    const g = document.createElement('div');
                    g.className = 'time-gap';
                    g.textContent = `· · · ${Math.round(gap)} ans · · ·`;
                    container.appendChild(g);
                }
            }
            lastSortKey = evt.sortKey;

            let placesHtml = '';
            if (evt.places && evt.places.length) {
                placesHtml = '<div class="event-places">' +
                    evt.places.map(p => `<a class="place-link" href="index.html?place=${p.id}">${p.name}</a>`).join('') +
                    '</div>';
            }

            let relatedHtml = '';
            const rels = (evt.related || []).filter(r => eventById[r.id]);
            if (rels.length) {
                const items = rels.map(r => {
                    const t = eventById[r.id];
                    return `<div class="related-item">
                        <span class="rel-type">${REL_LABELS[r.rel] || r.rel}</span>
                        <span class="rel-target" data-id="${r.id}">${t.title}</span>
                    </div>`;
                }).join('');
                relatedHtml = `<button class="related-toggle" data-id="${evt.id}">
                    Événements liés (${rels.length}) ▾</button>
                    <div class="related-panel" id="rel-${evt.id}">
                        <div class="related-panel-title">Connexions historiques</div>
                        ${items}
                    </div>`;
            }

            const bt = truncate(evt.body, 260);

            const el = document.createElement('div');
            el.className = 'timeline-event';
            el.dataset.id = evt.id;
            el.dataset.sortkey = evt.sortKey;
            el.dataset.category = evt.category;
            el.dataset.index = idx;

            el.innerHTML = `
                <div class="event-date">
                    <span class="date-str">${evt.date}</span>
                    <span class="period-tag">${period.label}</span>
                </div>
                <div class="event-dot" style="background:radial-gradient(circle at 35% 35%,${cat.color},${darken(cat.color,50)});">${cat.icon}</div>
                <div class="event-card">
                    <div class="event-card-header">
                        <span class="category-badge" style="background:${cat.color};">${cat.label}</span>
                        <span class="event-title">${evt.title}</span>
                    </div>
                    <div class="event-body${bt.truncated ? ' truncated' : ''}">${bt.html}</div>
                    ${placesHtml}
                    ${relatedHtml}
                </div>`;
            container.appendChild(el);
        });

        attachListeners();
        observeVisibility();
    }

    function attachListeners() {
        document.querySelectorAll('.event-body.truncated').forEach(el => {
            el.style.cursor = 'pointer';
            el.addEventListener('click', () => {
                const sh = el.querySelector('.desc-short');
                const fu = el.querySelector('.desc-full');
                if (fu.style.display === 'inline') { fu.style.display = 'none'; sh.style.display = 'inline'; }
                else { fu.style.display = 'inline'; sh.style.display = 'none'; }
            });
        });

        document.querySelectorAll('.related-toggle').forEach(btn => {
            btn.addEventListener('click', () => {
                const panel = document.getElementById('rel-' + btn.dataset.id);
                if (panel) {
                    panel.classList.toggle('open');
                    btn.textContent = btn.textContent.replace(/[▾▴]/, panel.classList.contains('open') ? '▴' : '▾');
                }
            });
        });

        document.querySelectorAll('.rel-target').forEach(el => {
            el.addEventListener('click', () => scrollToEvent(el.dataset.id));
        });
    }

    function scrollToEvent(id) {
        const el = document.querySelector(`.timeline-event[data-id="${id}"]`);
        if (!el) return;
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('visible');
        highlightEvent(el);
    }

    function highlightEvent(el) {
        document.querySelectorAll('.timeline-event.highlighted').forEach(e => e.classList.remove('highlighted'));
        el.classList.add('highlighted');
        setTimeout(() => el.classList.remove('highlighted'), 3000);
    }

    let observer;
    function observeVisibility() {
        if (observer) observer.disconnect();
        observer = new IntersectionObserver(entries => {
            entries.forEach(e => {
                if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); }
            });
        }, { threshold: 0.05, rootMargin: '0px 0px -30px 0px' });
        document.querySelectorAll('.timeline-event').forEach(el => observer.observe(el));
    }

    // ── Playback ──────────────────────────────────
    const STOPPED = 0, PLAYING = 1, PAUSED = 2;
    let playState = STOPPED, currentIndex = 0, playTimer = null, playSpeed = 2000;

    const playBtn = document.getElementById('play-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const speedSelect = document.getElementById('speed-select');
    const scrubber = document.getElementById('scrubber');
    const scrubberLabel = document.getElementById('scrubber-label');

    function updatePlayBtn() {
        playBtn.innerHTML = playState === PLAYING ? '&#9646;&#9646;' : '&#9654;';
        playBtn.title = playState === PLAYING ? 'Pause (Espace)' : 'Lecture (Espace)';
    }
    function stop() {
        playState = STOPPED; clearTimeout(playTimer); currentIndex = 0; updatePlayBtn();
        document.querySelectorAll('.timeline-event.highlighted').forEach(e => e.classList.remove('highlighted'));
    }
    function pause() { playState = PAUSED; clearTimeout(playTimer); updatePlayBtn(); }
    function play() { playState = PLAYING; updatePlayBtn(); advanceTo(currentIndex); }

    function advanceTo(idx) {
        if (idx < 0) idx = 0;
        if (idx >= filteredEvents.length) { stop(); return; }
        currentIndex = idx;
        const evt = filteredEvents[idx];
        const el = document.querySelector(`.timeline-event[data-id="${evt.id}"]`);
        if (!el) { if (playState === PLAYING) playTimer = setTimeout(() => advanceTo(idx+1), 100); return; }
        el.classList.add('visible');
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setTimeout(() => highlightEvent(el), 300);
        scrubber.value = Math.round((idx / Math.max(1, filteredEvents.length - 1)) * 100);
        scrubberLabel.textContent = evt.date;
        if (playState === PLAYING) {
            const next = filteredEvents[idx + 1];
            const periodChange = next && next.period !== evt.period;
            playTimer = setTimeout(() => advanceTo(idx + 1), periodChange ? playSpeed * 2 : playSpeed);
        }
    }

    playBtn.addEventListener('click', () => { playState === PLAYING ? pause() : play(); });
    prevBtn.addEventListener('click', () => { if (playState === PLAYING) pause(); advanceTo(currentIndex - 1); });
    nextBtn.addEventListener('click', () => { if (playState === PLAYING) pause(); advanceTo(currentIndex + 1); });
    speedSelect.addEventListener('change', () => { playSpeed = parseInt(speedSelect.value); });
    scrubber.addEventListener('input', () => {
        const pct = parseInt(scrubber.value);
        const idx = Math.round((pct / 100) * (filteredEvents.length - 1));
        if (playState === PLAYING) pause();
        advanceTo(idx);
    });

    // ── Filters ───────────────────────────────────
    function buildFilters() {
        const panel = document.getElementById('filter-panel');
        Object.entries(CATEGORIES).forEach(([key, cat]) => {
            const lbl = document.createElement('label');
            lbl.className = 'filter-label';
            lbl.innerHTML = `<input type="checkbox" class="filter-checkbox" data-category="${key}" checked>
                <span class="filter-dot" style="background:${cat.color};"></span>
                <span class="filter-name">${cat.label}</span>`;
            lbl.querySelector('input').addEventListener('change', applyFilters);
            panel.appendChild(lbl);
        });
    }

    function applyFilters() {
        const checked = new Set();
        document.querySelectorAll('.filter-checkbox:checked').forEach(cb => checked.add(cb.dataset.category));
        filteredEvents = HISTORY.filter(e => checked.has(e.category));
        document.querySelectorAll('.timeline-event').forEach(el => {
            el.style.display = checked.has(el.dataset.category) ? '' : 'none';
        });
        if (playState !== STOPPED) stop();
    }

    document.getElementById('filter-toggle').addEventListener('click', () => {
        document.getElementById('filter-panel').classList.toggle('open');
    });

    // ── Keyboard ──────────────────────────────────
    document.addEventListener('keydown', e => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
        switch (e.key) {
            case ' ': e.preventDefault(); playState === PLAYING ? pause() : play(); break;
            case 'ArrowRight': case 'ArrowDown':
                e.preventDefault(); if (playState === PLAYING) pause(); advanceTo(currentIndex + 1); break;
            case 'ArrowLeft': case 'ArrowUp':
                e.preventDefault(); if (playState === PLAYING) pause(); advanceTo(Math.max(0, currentIndex - 1)); break;
            case 'Escape': stop(); break;
        }
    });

    // ── Init ──────────────────────────────────────
    buildFilters();
    renderTimeline();
    if (filteredEvents.length > 0) scrubberLabel.textContent = filteredEvents[0].date;
    setTimeout(() => document.getElementById('keyboard-hint').classList.add('hidden'), 6000);

    })();
    </script>
</body>
</html>
